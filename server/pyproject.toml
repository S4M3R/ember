[project]
name = "ember-server"
version = "0.1.0"
description = "Ember WS hub, Pipecat observer, and mock feed."
requires-python = ">=3.11"
dependencies = [
    "websockets>=13.0",
    "python-dotenv>=1.0",
]

# The Pipecat agent itself lives in the official hackathon starter. Install it
# there and merge the observer (see INTEGRATION.md). Pinning pipecat here would
# fight the starter's own pins.
[project.optional-dependencies]
pipecat = [
    "pipecat-ai>=0.0.50",
]

[tool.uv]
package = false
